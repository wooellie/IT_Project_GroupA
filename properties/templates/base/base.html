<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UniNest{% endblock %}</title>
    <!-- 引入原有的 Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Bootstrap Icons CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net">
    
    <style>
        /* 模拟 iPhone 17 背景 */
        body {
            background-color: #222; /* 网页背景：深灰 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* iPhone 17 容器：锁定宽度 */
        .iphone-screen {
            width: 430px; /* iPhone 15/16/17 Pro Max 左右的宽度 */
            height: 932px;
            background: #fff;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            border: 12px solid #000; /* 模拟手机边框 */
            border-radius: 55px;
            scrollbar-width: none; /* 隐藏滚动条 (Firefox) */
        }

        .iphone-screen::-webkit-scrollbar {
            display: none; /* 隐藏滚动条 (Chrome/Safari) */
        }

        /* 状态栏占位（模拟灵动岛高度） */
        .status-bar {
            height: 44px;
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* 底部操作栏在容器内定位，不再是 fixed-bottom (window) */
        .container-bottom-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            z-index: 999;
        }

        {% block extra_css %}{% endblock %}
        
    </style>
</head>
<body>

    <div class="iphone-screen">
        
        <div class="status-bar d-flex justify-content-center align-items-end">
            <div style="width: 120px; height: 35px; background: #000; border-radius: 20px; margin-bottom: 5px;"></div>
        </div>
        <div class="container mt-2">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger alert-dismissible fade show small py-2" role="alert" 
                     style="margin: 10px; border-radius: 10px; font-size: 0.8rem;">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" style="padding: 0.8rem;"></button>
                </div>
            {% endfor %}
        {% endif %}
    </div>


        
        {% block content %}
        {% endblock %}
    </div>
    


        ...
    </div>   
    

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
