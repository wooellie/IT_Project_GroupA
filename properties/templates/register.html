{% extends 'base/base.html' %}

{% block title %}New Account - UniNest{% endblock %}

{% block extra_css %}
<style>
.register-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    min-height: 80vh;
}

.register-card {
    width: 100%;
    max-width: 450px; 
    background: white;
    padding: 40px 30px;
    border-radius: var(--border-radius);
    box-shadow: var(--shadow-md);
    border: 1px solid #e0e0e0;
}

.form-control {
    border-radius: 8px;
    padding: 12px;
    background-color: #f8f9fa;
    border: 1px solid #e0e0e0;
    transition: var(--transition);
}

.form-control:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 0.25rem rgba(176, 128, 244, 0.25);
    background-color: white;
}

.form-check-input:checked { 
    background-color: var(--primary-color); 
    border-color: var(--primary-color); 
}
</style>
{% endblock %}

{% block content %}
<div class="register-wrapper">
    <div class="register-card animate-fade-in-up">
        <div class="text-center mb-4">
            <h2 class="fw-bold"><i class="bi bi-person-plus text-primary"></i> Create Account</h2>
            <p class="text-muted">Join UniNest to find or list properties</p>
        </div>

        <form method="post">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label small fw-bold text-dark">User / Agency Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                    <input class="form-control border-start-0" name="username" placeholder="Pick a username" value="{{ typed_username|default:'' }}" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold text-dark">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                    <input class="form-control border-start-0" type="email" name="email" placeholder="example@mail.com" value="{{ typed_email|default:'' }}" required>
                </div>
            </div>

            <div class="form-check mb-3 p-3 bg-light rounded-3 border">
                <input class="form-check-input ms-1" type="checkbox" name="is_agency" id="isAgency" 
                       {% if role == 'agency' %}checked{% endif %}>
                <label class="form-check-label ms-2 small fw-bold" for="isAgency">
                    Register as agency <span class="text-muted fw-normal">(Auto-suffix -agency)</span>
                </label>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold text-dark">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                    <input class="form-control border-start-0" type="password" name="password1" placeholder="Create a password" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-dark">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill text-muted"></i></span>
                    <input class="form-control border-start-0" type="password" name="password2" placeholder="Repeat your password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3 fs-5">Sign Up</button>

            <div class="text-center pt-3 border-top">
                <p class="text-muted mb-0">Already have an account? <a href="{% url 'login' %}" class="text-decoration-none fw-bold" style="color: var(--primary-color);">Log in here</a></p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
