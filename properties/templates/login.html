<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#eee;">

<div class="d-flex justify-content-center align-items-center vh-100">

    <div class="bg-white p-5 rounded-5 shadow" style="width:420px; border:1px solid #ddd;">

        <h3 class="text-center mb-4">Login</h3>

        <form method="post">
            {% csrf_token %}

            <label class="mb-1">User name</label>
            <input class="form-control mb-3" name="username">

            <label class="mb-1">Password</label>
            <input class="form-control mb-4" type="password" name="password">

            <div class="text-center mb-3">
                <button class="btn btn-secondary px-4">Confirm</button>
            </div>

            <div class="text-center small">
                <a href="/register/">New User? Create account</a><br>
                <a href="/register/">New Agency? Create account</a><br>
                <a href="#">Forgot password</a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
