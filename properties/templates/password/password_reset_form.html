{% extends 'base/base.html' %}

{% block title %}Reset Password - UniNest{% endblock %}

{% block extra_css %}
<style>
.auth-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    min-height: 80vh;
}

.auth-card {
    width: 100%;
    max-width: 450px;
    background: white;
    padding: 40px 30px;
    border-radius: var(--border-radius);
    box-shadow: var(--shadow-md);
    border: 1px solid #e0e0e0;
}

.form-control {
    border-radius: 8px;
    padding: 12px;
    background-color: #f8f9fa;
    border: 1px solid #e0e0e0;
    transition: var(--transition);
}

.form-control:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 0.25rem rgba(176, 128, 244, 0.25);
    background-color: white;
}
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card text-center animate-fade-in-up">
        <h3 class="fw-bold mb-3"><i class="bi bi-key text-primary"></i> Forgot Password</h3>
        <p class="small text-secondary mb-4">Enter your email address to receive a reset link.</p>

        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                    <input type="email" name="email" class="form-control border-start-0" placeholder="Your Email Address" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3 fs-5">Send Reset Link</button>
            <a href="{% url 'login' %}" class="text-decoration-none small fw-bold" style="color: var(--primary-color);">Back to Login</a>
        </form>
    </div>
</div>
{% endblock %}
