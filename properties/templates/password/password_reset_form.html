{% extends 'base/base.html' %}

{% block content %}
<div class="register-wrapper">
    <div class="register-card text-center">
        <h3 class="fw-bold mb-3">Forgot Password</h3>
        <p class="small text-secondary mb-4">Enter your email address to receive a reset link.</p>

        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <input type="email" name="email" class="form-control" placeholder="Your Email Address" required>
            </div>
            <button type="submit" class="btn-confirm mb-3">Send Reset Link</button>
            <a href="{% url 'login' %}" class="text-decoration-none small fw-bold text-dark d-block">Back to Login</a>
        </form>
    </div>
</div>
{% endblock %}
