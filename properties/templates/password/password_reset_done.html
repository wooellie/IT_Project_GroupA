{% extends 'base/base.html' %}

{% block content %}
<div class="register-wrapper text-center">
    <div class="register-card">
        <div class="mb-3 text-success" style="font-size: 3rem;">✉️</div>
        <h3 class="fw-bold mb-3">Email Sent</h3>
        <p class="small text-secondary mb-4">We've emailed you instructions for setting your password. If you don't receive it, please check your spam folder.</p>
        <a href="{% url 'login' %}" class="btn-confirm text-decoration-none d-block">Back to Login</a>
    </div>
</div>
{% endblock %}
