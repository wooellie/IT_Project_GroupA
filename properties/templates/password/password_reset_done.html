{% extends 'base/base.html' %}

{% block title %}Email Sent - UniNest{% endblock %}

{% block extra_css %}
<style>
.auth-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    min-height: 80vh;
}

.auth-card {
    width: 100%;
    max-width: 450px;
    background: white;
    padding: 40px 30px;
    border-radius: var(--border-radius);
    box-shadow: var(--shadow-md);
    border: 1px solid #e0e0e0;
}
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper text-center">
    <div class="auth-card text-center animate-fade-in-up">
        <div class="mb-3 text-success" style="font-size: 4rem;"><i class="bi bi-envelope-check"></i></div>
        <h3 class="fw-bold mb-3">Email Sent</h3>
        <p class="small text-secondary mb-4">We've emailed you instructions for setting your password. If you don't receive it, please check your spam folder.</p>
        <a href="{% url 'login' %}" class="btn btn-primary-custom w-100 py-2 d-block text-decoration-none">Back to Login</a>
    </div>
</div>
{% endblock %}
